apiVersion: apps/v1
kind: Deployment
metadata:
  name: ewaste-portal
  labels:
    app: ewaste-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ewaste-portal
  template:apiVersion: apps/v1
kind: Deployment
metadata:
  name: ewaste-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ewaste-portal
  template:
    metadata:
      labels:
        app: ewaste-portal
    spec:
      containers:
        - name: ewaste-portal
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ewaste-portal-svc
spec:
  type: NodePort
  selector:
    app: ewaste-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
    metadata:
      labels:
        app: ewaste-portal
    spec:
      containers:
        - name: ewaste-portal
          image: abhinavdeo/ewaste-portal:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ewaste-portal
spec:
  type: NodePort
  selector:
    app: ewaste-portal
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
